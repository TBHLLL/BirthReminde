name: Build CIPX

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-cipx:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore BirthReminde.csproj

      - name: Build and package (.cipx)
        run: dotnet build BirthReminde.csproj -c Release -p:CreateCipx=true

      - name: Upload CIPX artifact
        uses: actions/upload-artifact@v4
        with:
          name: BirthReminde-cipx
          path: |
            cipx/*.cipx
            cipx/checksums.md
          if-no-files-found: error
